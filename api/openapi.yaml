        created_at: { type: string }
        file: { $ref: "#/components/schemas/FileMetadata" }
        owner: { $ref: "#/components/schemas/UserMinimal" }

    ShareListItem:
      type: object
      description: Thông tin chi tiết của một share trong danh sách
      properties:
        id:
