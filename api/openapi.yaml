          example: 1
        file_id:
          type: integer
          format: int64
          description: ID của file được chia sẻ
          example: 101
        hash:
          type: string
          description: Chuỗi định danh duy nhất của link share
          example: "a1b2c3d4"
        require_password:
          type: boolean
          description: Yêu cầu mật khẩu để tải file
          example: true
        revoked:
          type: boolean
          description: Trạng thái thu hồi (true là đã thu hồi)
          example: false
        expires_at:
          type: string
          format: date-time
          nullable: true
          description: Thời gian hết hạn link (null là vĩnh viễn)
